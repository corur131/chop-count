<style>
/* Layout: one phone-width column with a fixed bottom tab bar; two columns on wide screens (Fold inner display). */
:root {
  --bg: #F2F5F0;
  --surface: #FFFFFF;
  --surface-2: #E7EEE5;
  --ink: #14201A;
  --muted: #56675C;
  --line: #D4DED2;
  --green: #17744A;
  --green-soft: #DCEFE3;
  --on-green: #FFFFFF;
  --amber: #C98A0B;
  --prot: #2A66C4;
  --carb: #C98A0B;
  --fat: #C0432A;
  --water: #1C86AB;
  --warn: #B4531A;
  --shadow: 0 1px 2px rgba(20,32,26,.06), 0 6px 20px rgba(20,32,26,.06);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1310; --surface: #151D18; --surface-2: #1D2721; --ink: #E6EEE8; --muted: #98A99D; --line: #283530;
    --green: #3DB078; --green-soft: #173726; --on-green: #06130C; --amber: #EDB13A; --prot: #6FA3F3; --carb: #EDB13A;
    --fat: #EE7A5B; --water: #4DB6DA; --warn: #F0965A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1310; --surface: #151D18; --surface-2: #1D2721; --ink: #E6EEE8; --muted: #98A99D; --line: #283530;
  --green: #3DB078; --green-soft: #173726; --on-green: #06130C; --amber: #EDB13A; --prot: #6FA3F3; --carb: #EDB13A;
  --fat: #EE7A5B; --water: #4DB6DA; --warn: #F0965A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 150px; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 680px) { .grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } .col { display: grid; gap: 14px; } }
.col { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.wrapflex { display: flex; flex-wrap: wrap; gap: 8px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }
.brand-mark span { width: 14px; height: 14px; border-radius: 50%; background: var(--amber); box-shadow: 9px -5px 0 -3px var(--on-green); }
.datenav { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.datenav button { border: 0; background: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; }
.datenav button:disabled { opacity: .3; cursor: default; }
.datenav b { font-size: .88rem; min-width: 86px; text-align: center; }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 700; background: var(--green); color: var(--on-green); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.line { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.danger { background: var(--fat); color: #fff; }
.btn.sm { padding: 7px 12px; font-size: .85rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: .86rem; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg label { flex: 1; text-align: center; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: .88rem; cursor: pointer; }
.seg input:checked + span { background: var(--surface); box-shadow: var(--shadow); color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--green); }
.field { display: grid; gap: 6px; }
.field > span { font-size: .82rem; font-weight: 600; color: var(--muted); }
input[type=number], input[type=text], input[type=search], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-width: 0; }
textarea { min-height: 90px; font-size: .8rem; font-family: ui-monospace, Menlo, monospace; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }

/* Today ring */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.ring { position: relative; width: 150px; height: 150px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; }
.macros { display: grid; gap: 10px; min-width: 0; }
.macro .top { display: flex; justify-content: space-between; font-size: .85rem; gap: 6px; }
.macro .top b { font-weight: 700; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
@media (max-width: 380px) { .hero { grid-template-columns: 1fr; justify-items: center; } .macros { width: 100%; } }

.checklist { display: grid; gap: 2px; }
.check { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 800; color: transparent; }
.tick.on { background: var(--green); border-color: var(--green); color: var(--on-green); }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--green-soft); color: var(--green); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.est { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }

.meal { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.meal:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.meal-head { display: flex; justify-content: space-between; align-items: baseline; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto 32px; gap: 8px; align-items: center; padding: 6px 0; font-size: .92rem; }
.item .nm { min-width: 0; overflow-wrap: anywhere; }
.x { border: 0; background: var(--surface-2); width: 30px; height: 30px; border-radius: 50%; color: var(--muted); font-size: 1rem; }

.water-glasses { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.sachet { width: 22px; height: 30px; border-radius: 6px 6px 9px 9px; border: 2px solid var(--water); opacity: .35; }
.sachet.full { background: var(--water); opacity: 1; }

/* Log */
.food-list { display: grid; }
.food { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.food .nm { font-weight: 600; min-width: 0; }
.food .aka { font-size: .8rem; color: var(--muted); }
.food .kc { text-align: right; font-size: .85rem; }
.cat-h { margin: 16px 0 2px; }
.sug { padding-top: 12px; border-top: 1px solid var(--line); }
.sug:first-child { padding-top: 0; border-top: 0; }
.fav { display: inline-flex; align-items: center; gap: 8px; }

.tray { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 20; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.tray-in { max-width: 640px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 18px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.tray-in .muted { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.tray-list { max-height: 34vh; overflow-y: auto; margin: 10px 0; }
.tray .item { border-bottom: 1px solid color-mix(in srgb, var(--bg) 18%, transparent); }
.tray .x { background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); }
.tray .btn.ghost { background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); }
.tray input { background: transparent; border-color: color-mix(in srgb, var(--bg) 30%, transparent); color: var(--bg); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 640px; }
.tab { border: 0; background: none; padding: 9px 2px 10px; display: grid; justify-items: center; gap: 3px; font-size: .72rem; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--green); }
.tab.add .plus { width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: var(--on-green); display: grid; place-items: center; margin-top: -14px; box-shadow: var(--shadow); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; }
.sheet .scrim { position: absolute; inset: 0; background: rgba(5,10,7,.45); }
.sheet .panel { position: relative; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto; width: 100%; max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font-size: 1.3rem; font-weight: 700; }
.stepper b { font-family: var(--font-display); font-size: 1.5rem; min-width: 44px; text-align: center; }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center; }
.mgrid div { background: var(--surface-2); border-radius: 12px; padding: 8px 4px; }
.mgrid b { display: block; font-family: var(--font-display); font-size: 1.15rem; }
.mgrid span { font-size: .72rem; color: var(--muted); font-weight: 600; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; display: flex; gap: 14px; align-items: center; font-size: .9rem; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast button { background: none; border: 0; color: var(--amber); font-weight: 800; }

/* Plan */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wday { border-radius: 12px; padding: 8px 2px; text-align: center; background: var(--surface-2); font-size: .72rem; font-weight: 600; color: var(--muted); }
.wday b { display: block; font-size: .8rem; color: var(--ink); }
.wday { cursor: pointer; width: 100%; }
.wday.today { outline: 2px solid var(--green); }
.ex button.tick:disabled { opacity: .4; cursor: default; }
.wday.strength { background: var(--green-soft); }
.ex { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.ex:last-child { border-bottom: 0; }
.ex button.tick { cursor: pointer; background: none; }
.ex .dose { font-family: var(--font-display); font-weight: 700; }
.figbox { margin-top: 8px; max-width: 300px; }
.figbtn { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.fig { display: block; width: 100%; height: auto; }
.figbox .row { margin-top: 5px; font-size: .78rem; }
.figbox a { color: var(--green); font-weight: 700; text-decoration: none; }

/* Progress */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.suggest { border-left: 0; background: var(--green-soft); }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.4rem; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

/* Onboarding */
.ob { max-width: 620px; margin: 0 auto; }
.ob-hero { padding: 10px 0 18px; display: grid; gap: 8px; }
.ob-hero h1 { font-size: 2.1rem; line-height: 1.05; }
.preview { background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.preview .stats b { color: var(--bg); }
.preview .muted { color: color-mix(in srgb, var(--bg) 68%, transparent); }
.err { color: var(--fat); font-weight: 600; font-size: .88rem; }
@media (prefers-reduced-motion: no-preference) { .bar i, .ring circle { transition: all .4s ease; } }
</style>
</head>

<script>

  } catch (e) { docRef = null; storeMode = "local"; }
}

/* ---------- Targets ---------- */
function latestWeight(p) { const w = state.weights; return w.length ? w[w.length - 1].kg : p.weightKg; }
function weeksSince(start) { if (!start) return 0; return Math.max(0, Math.floor(daysBetween(start, todayStr()) / 7)); }
function formulaBurn(p, w) {
  const bmr = 10 * w + 6.25 * p.heightCm - 5 * p.age + (p.sex === "m" ? 5 : -161);
  return { bmr, tdee: bmr * p.act };
}
/* Measured burn: average intake on fully logged days minus energy stored or lost,
   from the least-squares weight trend over the last 28 days (7,700 kcal per kg). */
const KCAL_PER_KG = 7700;
function measuredBurn(p) {
  p = p || state.profile;
  if (!p) return null;
  const today = todayStr();
  const from = [addDays(today, -27), p.measureFrom || p.startDate].sort().pop();
  const ws = state.weights.filter(w => w.d >= from && w.d <= today);
  const formula = formulaBurn(p, latestWeight(p)).tdee;
  const spanDays = ws.length ? daysBetween(ws[0].d, today) + 1 : 0;
  const days = []; for (let ds = ws.length ? ws[0].d : today; ds <= today; ds = addDays(ds, 1)) days.push(ds);
  // A day counts as logged when it holds at least half a day's burn (skips forgotten meals)
  const logged = days.filter(ds => ds !== today && dayTotals(ds).kcal >= formula * 0.5);
  const need = { days: 14, logged: 10, weighins: 3 };
  const base = { spanDays, logged: logged.length, weighins: ws.length, need, formula: Math.round(formula) };
  if (spanDays < need.days || logged.length < need.logged || ws.length < need.weighins || daysBetween(ws[0].d, ws[ws.length - 1].d) < 10) return Object.assign(base, { ready: false });
  const x0 = parseDay(ws[0].d);
  const xs = ws.map(w => (parseDay(w.d) - x0) / 864e5), ys = ws.map(w => w.kg);
  const mx = xs.reduce((a, b) => a + b, 0) / xs.length, my = ys.reduce((a, b) => a + b, 0) / ys.length;
  let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
  const slope = den ? num / den : 0; // kg per day
  const intake = logged.reduce((a, ds) => a + dayTotals(ds).kcal, 0) / logged.length;
  const burn = intake - slope * KCAL_PER_KG;
  const ratio = logged.length / Math.max(1, spanDays - 1);
  let conf = "low";
  if (spanDays >= 21 && ratio >= 0.8 && ws.length >= 8) conf = "strong";
  else if (ratio >= 0.7 && ws.length >= 4) conf = "good";
  const sane = burn >= formula * 0.7 && burn <= formula * 1.4;
  if (!sane) conf = "low";
  return Object.assign(base, { ready: true, burn: Math.round(burn / 10) * 10, intake: Math.round(intake), weekly: slope * 7, conf, sane, ratio });
}
function targets(p, wOverride) {
  p = p || state.profile;
  const w = wOverride != null ? wOverride : latestWeight(p);
  const fb = formulaBurn(p, w), bmr = fb.bmr;
  let tdee = fb.tdee, source = "formula";
  const mb = wOverride == null && p.useMeasured !== false ? measuredBurn(p) : null;
  if (mb && mb.ready && mb.conf !== "low") { tdee = mb.burn; source = "measured"; }
  const delta = { gain: 400, lose: -500, maintain: 0 }[p.goal];
  const floor = p.sex === "m" ? 1500 : 1200;
  let cal = Math.round((tdee + delta + (source === "formula" ? (p.calAdjust || 0) : 0)) / 10) * 10;
  const floored = cal < floor;
  cal = Math.max(cal, floor);
  const protein = Math.round(w * (p.goal === "maintain" ? 1.4 : 1.8));
  const fat = Math.round(cal * 0.25 / 9);
  const carbs = Math.max(0, Math.round((cal - protein * 4 - fat * 9) / 4));
  const water = Math.max(1500, Math.round(w * 35 / 250) * 250);
  const base = p.baseSteps || 4000;
  let steps = p.goal === "lose" ? Math.min(10000, base + 1500 + 500 * weeksSince(p.startDate)) : Math.min(10000, Math.max(6000, base));
  steps = Math.round(steps / 500) * 500;
  return { w, bmr: Math.round(bmr), tdee: Math.round(tdee), formulaTdee: Math.round(fb.tdee), source, delta, cal, floor, floored, protein, fat, carbs, water, steps };
}

/* ---------- Days ---------- */
function getDay(ds) { return state.days[ds] || null; }
function ensureDay(ds) { if (!state.days[ds]) state.days[ds] = { items: [], water: 0, steps: 0, wd: false, ex: {} }; const d = state.days[ds]; if (!d.items && !d.sum) d.items = []; if (!d.ex) d.ex = {}; return d; }
function dayTotals(ds) {
  const d = state.days[ds];
  if (!d) return { kcal: 0, p: 0, c: 0, f: 0 };
  if (!d.items && d.sum) return d.sum;
  return (d.items || []).reduce((a, i) => ({ kcal: a.kcal + i.kcal, p: a.p + i.p, c: a.c + i.c, f: a.f + i.f }), { kcal: 0, p: 0, c: 0, f: 0 });
}
function calStatus(goal, eaten, t) {
  if (eaten < 1) return "none";
  const r = eaten / t.cal;
  if (goal === "gain") return r >= 0.95 ? "ok" : "under";
  if (goal === "lose") return r > 1.03 ? "over" : r >= 0.8 ? "ok" : "under";
  return r > 1.1 ? "over" : r >= 0.9 ? "ok" : "under";
}
function dayOnTrack(ds, t) { const tot = dayTotals(ds); return calStatus(state.profile.goal, tot.kcal, t) === "ok" && tot.p >= t.protein * 0.85; }
function streak(t) {
  let n = 0, ds = todayStr();
  if (!dayOnTrack(ds, t)) ds = addDays(ds, -1);
  while (dayOnTrack(ds, t) && n < 999) { n++; ds = addDays(ds, -1); }
  return n;
}

/* ---------- Workouts ---------- */
function walkEx(min, wk, brisk) { return [
  { n: brisk ? "Brisk walk" : "Easy walk", d: `${min} min`, t: brisk ? "Fast enough that talking is a little hard. Counts toward your steps." : "Relaxed pace. Gets blood moving to sore muscles." },
  { n: "Crunches", d: `3 × ${12 + wk}`, t: "Optional core work. Lift your shoulders, not your neck." },
  { n: "Lying leg raises", d: `3 × ${8 + wk}`, t: "Lower back pressed to the floor. Slow on the way down." },
  { n: "Superman hold", d: `3 × ${20 + 5 * wk} s`, t: "Lying face down, lift arms and legs together. Strengthens your back." }]; }
function restEx() { return [
  { n: "Hamstring stretch", d: "2 × 30 s each leg", t: "Leg straight on a chair, lean forward gently." },
  { n: "Hip flexor stretch", d: "2 × 30 s each side", t: "Kneel on one knee, push hips forward." },
  { n: "Chest stretch in a doorway", d: "2 × 30 s", t: "Forearm on the door frame, turn away slowly." },
  { n: "Child's pose", d: "1 min", t: "Knees wide, sit back on your heels, arms forward." }]; }
function workoutFor(ds) {
  const p = state.profile, dow = parseDay(ds).getDay(), wk = Math.min(8, weeksSince(p.startDate));
  if (p.goal === "gain") {
    if (dow === 1 || dow === 4) return { type: "strength", title: "Upper body", sub: "Rest 60–90 s between sets. Slow on the way down.", ex: [
      { n: "Push-ups", d: `4 × ${8 + wk}`, t: "Drop to your knees when you can't keep a straight body." },
      { n: "Backpack rows", d: `4 × ${10 + wk}`, t: "Load a backpack with books, hinge at the hips, pull it to your belly." },
      { n: "Chair dips", d: `3 × ${8 + wk}`, t: "Hands on a sturdy chair behind you, bend elbows to 90°." },
      { n: "Pike push-ups", d: `3 × ${6 + wk}`, t: "Hips high, lower your head toward the floor. Builds the shoulders." },
      { n: "Plank", d: `3 × ${30 + 5 * wk} s`, t: "Squeeze your glutes, keep your back flat." }] };
    if (dow === 2 || dow === 5) return { type: "strength", title: "Lower body", sub: "Rest 60–90 s between sets.", ex: [
      { n: "Squats", d: `4 × ${12 + wk}`, t: "Hold the loaded backpack once 20 reps feel easy." },
      { n: "Reverse lunges", d: `3 × ${8 + wk} each leg`, t: "Step back, lower the back knee close to the floor." },
      { n: "Glute bridges", d: `3 × ${12 + wk}`, t: "Pause 1 second at the top." },
      { n: "Calf raises on a step", d: `3 × ${15 + wk}`, t: "Full stretch at the bottom, full rise at the top." },
      { n: "Side plank", d: `2 × ${20 + 5 * wk} s each side`, t: "Hips up in a straight line." }] };
    if (dow === 3 || dow === 6) return { type: "walk", title: "Walk and core", sub: "Recovery day: an easy walk plus 10 minutes of core work at home.", ex: walkEx(20, wk, false) };
    return { type: "rest", title: "Rest and stretch", sub: "Eat your full target today. Muscle grows on rest days. Stretching is optional.", ex: restEx() };
  }
  if (p.goal === "lose") {
    const rounds = wk >= 3 ? 4 : 3;
    if (dow === 1 || dow === 3 || dow === 5) return { type: "strength", title: `Full-body circuit · ${rounds} rounds`, sub: "Do each move once, rest 1 minute, then repeat the round.", ex: [
      { n: "Squats", d: `${12 + wk} reps`, t: "Sit back like there's a chair behind you." },
      { n: "Push-ups", d: `${6 + wk} reps`, t: "Knees down or hands on a table edge is fine." },
      { n: "Glute bridges", d: `${12 + wk} reps`, t: "Pause 1 second at the top." },
      { n: "Step-ups on a stair", d: `${10 + Math.floor(wk / 2)} each leg`, t: "Push through the front heel." },
      { n: "Marching on the spot", d: `${30 + 5 * wk} s`, t: "Knees high, arms pumping. Swap for jumping jacks when ready." },
      { n: "Plank", d: `${20 + 5 * wk} s`, t: "Knees down if your back sags." }] };
    if (dow === 2 || dow === 4 || dow === 6) return { type: "walk", title: "Brisk walk and core", sub: "A 30-minute brisk walk, then 10 minutes of core work at home.", ex: walkEx(30, wk, true) };
    return { type: "rest", title: "Rest and stretch", sub: "An easy stroll is fine. Keep to your calorie target.", ex: restEx() };
  }
  if (dow === 1 || dow === 3 || dow === 5) return { type: "strength", title: "Full body", sub: "3 sets each, rest 60 s.", ex: [
    { n: "Squats", d: `3 × ${12 + wk}`, t: "" }, { n: "Push-ups", d: `3 × ${8 + wk}`, t: "" },
    { n: "Backpack rows", d: `3 × ${10 + wk}`, t: "" }, { n: "Glute bridges", d: `3 × ${12 + wk}`, t: "" },
    { n: "Plank", d: `3 × ${30 + 5 * wk} s`, t: "" }] };
  if (dow === 0) return { type: "rest", title: "Rest and stretch", sub: "", ex: restEx() };
  return { type: "walk", title: "Walk and core", sub: "", ex: walkEx(20, wk, false) };
}

function weightChart() {

  lo = Math.floor(lo); hi = Math.ceil(hi);
  const X = d => L + (daysBetween(pts[0].d, d) / span) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi];

  const area = path + ` L${X(pts[pts.length - 1].d).toFixed(1)} ${H - B} L${L} ${H - B} Z`;
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt1(v)}</text>`).join("")}

    <div class="checklist" style="margin-bottom:12px">${row("Burn at rest (BMR, formula)", fmt(t.bmr) + " kcal")}${row("Daily burn, formula estimate", fmt(t.formulaTdee) + " kcal")}</div>

function suggestion(t) {
  const p = state.profile, ws = state.weights;
  if (t.source === "measured") return null;
  if (ws.length < 2) return null;
  const since = p.lastAdjust || p.startDate;
  const recent = ws.filter(w => w.d >= since && daysBetween(w.d, todayStr()) <= 21);
  if (recent.length < 2) return null;
  const first = recent[0], last = recent[recent.length - 1], span = daysBetween(first.d, last.d);
  if (span < 12) return { wait: true, text: `Weekly check: keep weighing in. Your plan is reviewed once you have two weigh-ins at least 12 days apart.` };
  const rate = (last.kg - first.kg) / span * 7;
  const r = `${rate >= 0 ? "+" : ""}${fmt1(rate)} kg/week`;
  if (p.goal === "gain") {
    if (rate < 0.1) return { delta: 200, text: `You're gaining ${r}, slower than the 0.25–0.5 kg/week that builds size. Add 200 kcal a day.` };
    if (rate > 0.6) return { delta: -150, text: `You're gaining ${r}. Above about 0.5 kg/week most of the extra is fat. Cut 150 kcal a day.` };
    return { ok: true, text: `Gaining ${r}. Right on pace; keep the plan as it is.` };
  }
  if (p.goal === "lose") {
    if (rate > -0.2) {
      if (t.cal - 150 < t.floor) return { ok: true, text: `Losing ${r}. Your calories are already at the safe minimum, so add 1,000 steps a day instead of eating less.` };
      return { delta: -150, text: `Losing ${r}, slower than the 0.25–0.75 kg/week target. Cut 150 kcal a day.` };
    }
    if (rate < -0.01 * t.w) return { delta: 150, text: `Losing ${r}, faster than 1% of your weight a week, which costs muscle. Add 150 kcal a day.` };
    return { ok: true, text: `Losing ${r}. Right on pace; keep the plan as it is.` };
  }
  if (Math.abs(rate) > 0.3) return { delta: rate > 0 ? -150 : 150, text: `Your weight is moving ${r}. Adjust by ${rate > 0 ? "−" : "+"}150 kcal a day to hold steady.` };
  return { ok: true, text: `Weight steady (${r}). Keep the plan as it is.` };
}

    $("#cf-portion-wrap").hidden = pack; return;
  }
  if (t.id === "use-measured") { state.profile.useMeasured = t.checked; save(); render(); toast(t.checked ? "Targets will use your measured burn" : "Targets use the formula"); }
  else if (t.name === "slot") { logSlot = t.value; render(); }
  else if (t.name === "oil") { sheetState.oil = t.value; drawSheet(); }
  else if (t.name === "pf-hu") {
    const { p } = readProfile(); obUnit = t.value;
    if (!state.profile) { $("#app").innerHTML = onboardingHTML(); fill(p); updatePreview(); }
    else { render(); fill(p); }
  } else if (t.closest && t.closest(".ob")) updatePreview();
});
function fill(p) {
  const set = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
  set("pf-name", p.name); set("pf-age", p.age || ""); set("pf-w", p.weightKg || ""); set("pf-act", p.act); set("pf-steps", p.baseSteps || ""); set("pf-budget", p.budget || "");
  if (p.heightCm) { if (obUnit === "cm") set("pf-h", p.heightCm); else { set("pf-ft", Math.floor(p.heightCm / 30.48)); set("pf-in", Math.round((p.heightCm / 2.54) % 12)); } }
  ["pf-goal", "pf-sex"].forEach(n => { const v = n === "pf-goal" ? p.goal : p.sex; const r = document.querySelector(`input[name="${n}"][value="${v}"]`); if (r) r.checked = true; });
}
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("#sheet").hidden) closeSheet();
  if (ev.key === "Enter" && ev.target.id === "fav-name") { ev.preventDefault(); $("[data-act=savefav]").click(); }
});
/* Keep "today" fresh if the app stays open past midnight */
let lastSeenDay = todayStr();
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayStr() !== lastSeenDay) { if (viewDate === lastSeenDay) viewDate = todayStr(); lastSeenDay = todayStr(); render(); } });

/* ---------- Installed app: updates and offline ---------- */
const APP_BUILD = Number("__BUILD__") || 0;
const UPDATE_URL = "https://corur131.github.io/chop-count/version.json";
let updateInfo = null;
const IS_NATIVE = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform());
async function checkUpdate() {
  if (!IS_NATIVE || !APP_BUILD) return;
  try {
    const r = await fetch(UPDATE_URL + "?t=" + Date.now(), { cache: "no-store" });
    const v = await r.json();
    if (v && v.build > APP_BUILD && v.apk) { updateInfo = v; render(); }
  } catch (e) {}
}
function updateBanner() {
  if (!updateInfo) return "";
  return `<section class="card suggest"><div class="row between"><div><b>New version available</b><p class="small muted" style="margin:2px 0 0">Download it, then install over this app. Your data stays.</p></div>
    <a class="btn sm" href="${esc(updateInfo.apk)}" target="_blank" rel="noopener" style="text-decoration:none">Download</a></div></section>`;
}
if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname)) { navigator.serviceWorker.register("sw.js").catch(() => {}); }

/* ---------- Boot ---------- */
(function boot() {
  const local = readLocal();
  if (local && local.v) state = Object.assign(blank(), local);
  syncCustom();
  render();
  connectCloud();
  checkUpdate();
})();
</script>
</body>
