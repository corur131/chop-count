<style>
/* Layout: one phone-width column with a fixed bottom tab bar; two columns on wide screens (Fold inner display). */
:root {
  --bg: #F2F5F0;
  --surface: #FFFFFF;
  --surface-2: #E7EEE5;
  --ink: #14201A;
  --muted: #56675C;
  --line: #D4DED2;
  --green: #17744A;
  --green-soft: #DCEFE3;
  --on-green: #FFFFFF;
  --amber: #C98A0B;
  --prot: #2A66C4;
  --carb: #C98A0B;
  --fat: #C0432A;
  --water: #1C86AB;
  --warn: #B4531A;
  --shadow: 0 1px 2px rgba(20,32,26,.06), 0 6px 20px rgba(20,32,26,.06);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1310; --surface: #151D18; --surface-2: #1D2721; --ink: #E6EEE8; --muted: #98A99D; --line: #283530;
    --green: #3DB078; --green-soft: #173726; --on-green: #06130C; --amber: #EDB13A; --prot: #6FA3F3; --carb: #EDB13A;
    --fat: #EE7A5B; --water: #4DB6DA; --warn: #F0965A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1310; --surface: #151D18; --surface-2: #1D2721; --ink: #E6EEE8; --muted: #98A99D; --line: #283530;
  --green: #3DB078; --green-soft: #173726; --on-green: #06130C; --amber: #EDB13A; --prot: #6FA3F3; --carb: #EDB13A;
  --fat: #EE7A5B; --water: #4DB6DA; --warn: #F0965A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 150px; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 680px) { .grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } .col { display: grid; gap: 14px; } }
.col { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.wrapflex { display: flex; flex-wrap: wrap; gap: 8px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }
.brand-mark span { width: 14px; height: 14px; border-radius: 50%; background: var(--amber); box-shadow: 9px -5px 0 -3px var(--on-green); }
.datenav { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.datenav button { border: 0; background: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; }
.datenav button:disabled { opacity: .3; cursor: default; }
.datenav b { font-size: .88rem; min-width: 86px; text-align: center; }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 700; background: var(--green); color: var(--on-green); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.line { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.danger { background: var(--fat); color: #fff; }
.btn.sm { padding: 7px 12px; font-size: .85rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: .86rem; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg label { flex: 1; text-align: center; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: .88rem; cursor: pointer; }
.seg input:checked + span { background: var(--surface); box-shadow: var(--shadow); color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--green); }
.field { display: grid; gap: 6px; }
.field > span { font-size: .82rem; font-weight: 600; color: var(--muted); }
input[type=number], input[type=text], input[type=search], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-width: 0; }
textarea { min-height: 90px; font-size: .8rem; font-family: ui-monospace, Menlo, monospace; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }

/* Today ring */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.ring { position: relative; width: 150px; height: 150px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; }
.macros { display: grid; gap: 10px; min-width: 0; }
.macro .top { display: flex; justify-content: space-between; font-size: .85rem; gap: 6px; }
.macro .top b { font-weight: 700; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
@media (max-width: 380px) { .hero { grid-template-columns: 1fr; justify-items: center; } .macros { width: 100%; } }

.checklist { display: grid; gap: 2px; }
.check { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 800; color: transparent; }
.tick.on { background: var(--green); border-color: var(--green); color: var(--on-green); }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--green-soft); color: var(--green); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.est { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }

.meal { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.meal:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.meal-head { display: flex; justify-content: space-between; align-items: baseline; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto 32px; gap: 8px; align-items: center; padding: 6px 0; font-size: .92rem; }
.item .nm { min-width: 0; overflow-wrap: anywhere; }
.x { border: 0; background: var(--surface-2); width: 30px; height: 30px; border-radius: 50%; color: var(--muted); font-size: 1rem; }

.water-glasses { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.sachet { width: 22px; height: 30px; border-radius: 6px 6px 9px 9px; border: 2px solid var(--water); opacity: .35; }
.sachet.full { background: var(--water); opacity: 1; }

/* Log */
.food-list { display: grid; }
.food { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.food .nm { font-weight: 600; min-width: 0; }
.food .aka { font-size: .8rem; color: var(--muted); }
.food .kc { text-align: right; font-size: .85rem; }
.cat-h { margin: 16px 0 2px; }
.sug { padding-top: 12px; border-top: 1px solid var(--line); }
.sug:first-child { padding-top: 0; border-top: 0; }
.fav { display: inline-flex; align-items: center; gap: 8px; }

.tray { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 20; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.tray-in { max-width: 640px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 18px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.tray-in .muted { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.tray-list { max-height: 34vh; overflow-y: auto; margin: 10px 0; }
.tray .item { border-bottom: 1px solid color-mix(in srgb, var(--bg) 18%, transparent); }
.tray .x { background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); }
.tray .btn.ghost { background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); }
.tray input { background: transparent; border-color: color-mix(in srgb, var(--bg) 30%, transparent); color: var(--bg); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 640px; }
.tab { border: 0; background: none; padding: 9px 2px 10px; display: grid; justify-items: center; gap: 3px; font-size: .72rem; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--green); }
.tab.add .plus { width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: var(--on-green); display: grid; place-items: center; margin-top: -14px; box-shadow: var(--shadow); }

/* Sheet */
[hidden] { display: none !important; }
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; }
.sheet .scrim { position: absolute; inset: 0; background: rgba(5,10,7,.45); }
.sheet .panel { position: relative; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto; width: 100%; max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font-size: 1.3rem; font-weight: 700; }
.stepper b { font-family: var(--font-display); font-size: 1.5rem; min-width: 44px; text-align: center; }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center; }
.mgrid div { background: var(--surface-2); border-radius: 12px; padding: 8px 4px; }
.mgrid b { display: block; font-family: var(--font-display); font-size: 1.15rem; }
.mgrid span { font-size: .72rem; color: var(--muted); font-weight: 600; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; display: flex; gap: 14px; align-items: center; font-size: .9rem; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast button { background: none; border: 0; color: var(--amber); font-weight: 800; }

/* Plan */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wday { border-radius: 12px; padding: 8px 2px; text-align: center; background: var(--surface-2); font-size: .72rem; font-weight: 600; color: var(--muted); }
.wday b { display: block; font-size: .8rem; color: var(--ink); }
.wday { cursor: pointer; width: 100%; }
.wday.today { outline: 2px solid var(--green); }
.ex button.tick:disabled { opacity: .4; cursor: default; }
.wday.strength { background: var(--green-soft); }
.ex { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.ex:last-child { border-bottom: 0; }
.ex button.tick { cursor: pointer; background: none; }
.ex .dose { font-family: var(--font-display); font-weight: 700; }
.figbox { margin-top: 8px; max-width: 300px; }
.figbtn { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.fig { display: block; width: 100%; height: auto; }
.figbox .row { margin-top: 5px; font-size: .78rem; }
.figbox a { color: var(--green); font-weight: 700; text-decoration: none; }

.protline { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
.kvs { display: grid; gap: 8px; }
.kv { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; font-size: .9rem; }
.kv b { font-weight: 600; }
.coach { margin: 6px 0 0; padding: 8px 10px; background: var(--surface-2); border-radius: 10px; }
.coachlist { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.parq { padding-left: 20px; margin: 10px 0; display: grid; gap: 6px; }
.sets { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 6px 8px; align-items: center; margin-top: 8px; max-width: 300px; }
.sets.one { grid-template-columns: auto minmax(0, 1fr); }
.sets input { padding: 8px 10px; }
.opts { display: grid; gap: 6px; }
.opts label { display: block; position: relative; }
.opts input { position: absolute; opacity: 0; pointer-events: none; }
.opts span { display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-size: .9rem; }
.opts small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
.opts input:checked + span { border-color: var(--green); background: var(--green-soft); }
.opts input:focus-visible + span { outline: 2px solid var(--green); }
details summary { cursor: pointer; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--green); font-weight: 700; font-size: inherit; cursor: pointer; }
.restchip { position: fixed; right: 16px; bottom: calc(136px + env(safe-area-inset-bottom, 0px)); z-index: 61; background: var(--green); color: var(--on-green); border-radius: 14px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 1rem; }
.restchip b { font-family: var(--font-display); font-size: 1.2rem; }
.restchip button { background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; }

/* Progress */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.suggest { border-left: 0; background: var(--green-soft); }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.4rem; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

/* Onboarding */
.ob { max-width: 620px; margin: 0 auto; }
.ob-hero { padding: 10px 0 18px; display: grid; gap: 8px; }
.ob-hero h1 { font-size: 2.1rem; line-height: 1.05; }
.preview { background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.preview .stats b { color: var(--bg); }
.preview .muted { color: color-mix(in srgb, var(--bg) 68%, transparent); }
.err { color: var(--fat); font-weight: 600; font-size: .88rem; }
@media (prefers-reduced-motion: no-preference) { .bar i, .ring circle { transition: all .4s ease; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="rest" class="restchip" role="timer" aria-live="polite" hidden></div>

<script>
"use strict";
/* ---------- Exercise figures: a jointed stick figure animated between two poses ---------- */

const FIGS = {

  plank: { props: [], dur: 3.6, A: { hip: [91, 94], t: -14, hd: -10, foot: 100, arms: [{ a: [90, 0] }, { a: [90, 0] }], legs: [{ to: [40, 106], bend: 1 }, { to: [40, 106], bend: 1 }] },
    B: { hip: [91, 96], t: -12, hd: -10, foot: 100, arms: [{ a: [90, 0] }, { a: [90, 0] }], legs: [{ to: [40, 106], bend: 1 }, { to: [40, 106], bend: 1 }] } },
  sideplank: { props: [], dur: 3.6, A: { hip: [91, 92], t: -15, hd: -15, foot: 100, arms: [{ a: [90, 0] }, { a: [-80, -80] }], legs: [{ to: [40, 106], bend: 1 }, { to: [42, 104], bend: 1 }] },
    B: { hip: [91, 97], t: -10, hd: -12, foot: 100, arms: [{ a: [90, 0] }, { a: [-80, -80] }], legs: [{ to: [40, 106], bend: 1 }, { to: [42, 104], bend: 1 }] } },
  pike: { props: [], A: { hip: [86, 60], t: 25, hd: 30, foot: 80, arms: [{ to: [134, 107], bend: 1 }, { to: [134, 107], bend: 1 }], legs: [{ to: [56, 106], bend: 1 }, { to: [56, 106], bend: 1 }] },

/* ---------- Realistic goal plan ---------- */
const GAIN_RATE = { m: { new: 0.004, some: 0.0025, exp: 0.0015 }, f: { new: 0.0025, some: 0.0015, exp: 0.001 } };

function planRateKg(p, w) {
  const c = tcfg(p);
  if (p.goal === "lose") { if (p.targetKg && w <= p.targetKg) return 0; return -w * { slow: 0.005, steady: 0.0075, fast: 0.01 }[c.pace]; }
  if (p.goal === "gain") { if (p.targetKg && w >= p.targetKg) return 0; return w * Math.min(0.005, GAIN_RATE[p.sex === "m" ? "m" : "f"][c.level] * { slow: 0.75, steady: 1, fast: 1.25 }[c.pace]); }
  return 0;
}
function goalPlan(p, t) {
  const w = t.w, target = p.targetKg, rate = t.rate, minW = bmiKg(p, 18.5);
  const out = { w, target, rate, minW, months: [] };
  const fr = rate / w;
  for (let m = 1; m <= 3; m++) out.months.push(w * (1 + fr) ** (m * 4.345));
  out.safe = p.goal === "lose" ? [w * 0.005, w * 0.01] : p.goal === "gain" ? [w * 0.0025, w * 0.005] : null;
  if (target && rate) {
    let goalW = target;
    if (p.goal === "lose" && target < minW) { out.lowWarn = true; goalW = Math.ceil(minW); }
    const n = Math.log(goalW / w) / Math.log(1 + fr);
    if (n > 0 && isFinite(n)) { out.weeks = Math.ceil(n); out.date = addDays(todayStr(), Math.ceil(n * 7)); out.goalW = goalW; }
  }
  if (target && ((p.goal === "lose" && w <= target) || (p.goal === "gain" && w >= target))) out.reached = true;

/* ---------- Adaptive step goal (Adams et al. 2013): 60th percentile of the last 9 days with steps logged ---------- */
function stepGoal(ds) {
  const p = state.profile, vals = [];
  for (let i = 1; i <= 9; i++) { const d = state.days[addDays(ds, -i)]; if (d && d.steps > 0) vals.push(d.steps); }
  if (vals.length < 3) {
    const base = p.baseSteps || 4000;
    let s = p.goal === "lose" ? Math.min(10000, base + 1500) : Math.min(10000, Math.max(6000, base));
    return { goal: Math.round(s / 500) * 500, n: vals.length, adaptive: false };
  }
  vals.sort((a, b) => a - b);
  const pos = (vals.length - 1) * 0.6, lo = Math.floor(pos), v = vals[lo] + (vals[Math.min(lo + 1, vals.length - 1)] - vals[lo]) * (pos - lo);
  return { goal: Math.max(3000, Math.min(20000, Math.round(v / 100) * 100)), n: vals.length, adaptive: true };
}

let logQuery = "";

function tabsHTML() {
  const t = (k, label) => `<button class="tab" data-tab="${k}" ${current === k ? 'aria-current="page"' : ""}>${ICONS[k]}<span>${label}</span></button>`;
  return `<nav class="tabs" aria-label="Sections"><div class="tabs-in">
    ${t("today", "Today")}${t("plan", "Workout")}
    <button class="tab add" data-tab="log" ${current === "log" ? 'aria-current="page"' : ""}><span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></span><span>Add food</span></button>
    ${t("progress", "Progress")}${t("me", "Me")}
  </div></nav>`;
}
function topbar(title, withDate) {
  const isToday = viewDate === todayStr();
  return `<div class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><span></span></div><h1>${title}</h1></div>
    ${withDate ? `<div class="datenav"><button data-act="prevday" aria-label="Previous day">‹</button><b>${dayLabel(viewDate)}</b><button data-act="nextday" aria-label="Next day" ${isToday ? "disabled" : ""}>›</button></div>` : ""}</div>`;
}

function render() {
  const app = $("#app");
  if (!state.profile) { app.innerHTML = onboardingHTML(); updatePreview(); return; }
  let body = "";
  if (current === "today") body = todayHTML();
  else if (current === "log") body = logHTML();
  else if (current === "plan") body = planHTML();
  else if (current === "progress") body = progressHTML();
  else body = meHTML();
  app.innerHTML = `<main class="wrap">${body}</main>${current === "log" && plate.length ? trayHTML() : ""}${tabsHTML()}`;
  startFigs();
}

/* ---------- Profile form (onboarding + edit) ---------- */
function profileFields(p, edit) {
  p = p || {};
  const actSel = actNew(p) ? Number(p.act) : (ACT_OLD[p.act] || 1.2);
  const radio = (name, val, label, checked) => `<label><input type="radio" name="${name}" value="${val}" ${checked ? "checked" : ""}><span>${label}</span></label>`;
  const hcm = p.heightCm || "";
  const ft = hcm ? Math.floor(hcm / 30.48) : "", inch = hcm ? Math.round((hcm / 2.54) % 12) : "";
  return `<div class="grid">
    <label class="field"><span>Your name</span><input type="text" id="pf-name" maxlength="30" value="${esc(p.name || "")}" placeholder="e.g. Shaka" autocomplete="given-name"></label>
    <div class="field"><span>Weight goal</span><div class="seg" role="radiogroup">${radio("pf-goal", "gain", "Gain weight", p.goal === "gain")}${radio("pf-goal", "lose", "Lose weight", p.goal === "lose")}${radio("pf-goal", "maintain", "Stay the same", p.goal === "maintain")}</div></div>
    <div class="field"><span>Sex (used in the calorie formula)</span><div class="seg" role="radiogroup">${radio("pf-sex", "m", "Male", p.sex === "m")}${radio("pf-sex", "f", "Female", p.sex === "f")}</div></div>
    <div class="fields">
      <label class="field"><span>Age (years)</span><input type="number" id="pf-age" inputmode="numeric" min="13" max="90" value="${p.age || ""}"></label>
      ${edit ? "" : `<label class="field"><span>Weight (kg)</span><input type="number" id="pf-w" inputmode="decimal" min="30" max="250" step="0.1" value="${p.weightKg || ""}"></label>`}
    </div>
    <div class="field"><span class="row between"><span>Height</span><span class="seg" style="padding:2px;font-size:.8rem">${radio("pf-hu", "cm", "cm", obUnit === "cm")}${radio("pf-hu", "ft", "ft / in", obUnit === "ft")}</span></span>
      ${obUnit === "cm" ? `<input type="number" id="pf-h" inputmode="numeric" min="120" max="230" value="${hcm}" placeholder="e.g. 175">`
      : `<div class="fields"><input type="number" id="pf-ft" inputmode="numeric" min="4" max="7" value="${ft}" placeholder="feet" aria-label="Feet"><input type="number" id="pf-in" inputmode="numeric" min="0" max="11" value="${inch}" placeholder="inches" aria-label="Inches"></div>`}
    </div>
    <label class="field"><span>How active is your day? (not counting workouts; the app adds those)</span><select id="pf-act">${ACT.map(a => `<option value="${a.k}" ${actSel === a.k ? "selected" : ""}>${a.label} — ${a.sub}</option>`).join("")}</select></label>
    <label class="field"><span>Daily food budget in naira (optional)</span><input type="number" id="pf-budget" inputmode="numeric" min="0" max="1000000" step="100" value="${p.budget || ""}" placeholder="e.g. 3000"></label>
    <h3 style="margin-top:6px">Training</h3>
    ${trainerFields(p)}
  </div>`;
}
function readProfile() {
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  const r = name => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ""; };
  let heightCm;
  if (obUnit === "cm") heightCm = Number(v("pf-h"));
  else heightCm = Math.round((Number(v("pf-ft")) * 12 + Number(v("pf-in") || 0)) * 2.54);
  const p = { name: v("pf-name"), goal: r("pf-goal"), sex: r("pf-sex"), age: Number(v("pf-age")), weightKg: document.getElementById("pf-w") ? Number(v("pf-w")) : (state.profile ? latestWeight(state.profile) : 0), heightCm, act: Number(v("pf-act")), actV: 2, budget: Number(v("pf-budget")) || 0 };
  Object.assign(p, readTrainer());
  const missing = [];
  if (!p.goal) missing.push("weight goal");
  if (!p.sex) missing.push("sex");
  if (!(p.age >= 13 && p.age <= 90)) missing.push("age (13–90)");
  if (!(p.weightKg >= 30 && p.weightKg <= 250)) missing.push("weight (30–250 kg)");
  if (!(p.heightCm >= 120 && p.heightCm <= 230)) missing.push("height (120–230 cm)");
  if (!p.bodyGoal) missing.push("body goal");
  const te = targetErr(p); if (te) missing.push(te);
  return { p, missing };
}
function targetErr(p) {
  const tg = p.targetKg; if (!tg) return "";
  if (!(tg >= 30 && tg <= 250)) return "target weight (30–250 kg)";
  if (p.weightKg && p.goal === "lose" && tg >= p.weightKg) return "a target weight below your current weight (you chose Lose weight)";
  if (p.weightKg && p.goal === "gain" && tg <= p.weightKg) return "a target weight above your current weight (you chose Gain weight)";
  return "";
}
function onboardingHTML() {
  return `<main class="wrap"><div class="ob">
    <div class="ob-hero"><div class="brand"><div class="brand-mark" aria-hidden="true"><span></span></div><span class="eyebrow">Chop Count</span></div>
      <h1>Count your chop, hit your goal.</h1>
      <p class="muted">Calories and macros for eba, egusi, jollof, suya, shawarma and 175 more foods Nigerians eat, plus water, steps and a workout plan built around your goal.</p></div>
    <div class="grid">
      <div class="card">${profileFields({})}</div>
      <div class="preview" id="preview"></div>
      <p class="err" id="ob-err" hidden></p>
      <button class="btn block" data-act="start">Start tracking</button>
    </div></div></main>`;
}
function previewInner(p, missing) {
  if (missing.length) return `<span class="eyebrow muted">Your daily targets</span><p class="muted small">Fill in ${missing.join(", ")} to see your targets.</p>`;
  const t = targets(Object.assign({ startDate: todayStr(), calAdjust: 0 }, p), p.weightKg);
  return `<span class="eyebrow muted">Your daily targets</span>
    <div class="stats"><div class="stat"><span class="small muted">Calories</span><b class="num">${fmt(t.cal)}</b></div><div class="stat"><span class="small muted">Protein</span><b class="num">${t.protein} g</b></div><div class="stat"><span class="small muted">Water</span><b class="num">${fmt1(t.water / 1000)} L</b></div></div>
    <p class="small muted">You burn about ${fmt(t.tdee)} kcal a day. ${p.goal === "maintain" ? "You'll eat about the same." : t.floored ? `Your target stays at the ${fmt(t.floor)} kcal safe minimum, which loses about ${fmt1(Math.abs(t.rate))} kg a week.` : `You'll eat about ${fmt(Math.abs(t.delta))} ${t.delta > 0 ? "more" : "less"} than that to ${p.goal} about ${fmt1(Math.abs(t.rate))} kg a week.`}</p>`;
}
function updatePreview() { const el = $("#preview"); if (!el) return; const { p, missing } = readProfile(); el.innerHTML = previewInner(p, missing); }

/* ---------- Today ---------- */
function ringSVG(eaten, target) {
  const r = 62, c = 2 * Math.PI * r, frac = Math.min(1, eaten / target), over = eaten > target * 1.03;
  return `<svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="${over && state.profile.goal !== "gain" ? "var(--fat)" : "var(--green)"}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(c * frac).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}
function macroBar(label, have, goal, color) {
  const pct = Math.min(100, goal ? have / goal * 100 : 0);
  return `<div class="macro"><div class="top"><span>${label}</span><span class="num"><b>${fmt(have)}</b> / ${fmt(goal)} g</span></div><div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}
function spentHTML(ds) {
  const d = getDay(ds), p = state.profile;
  const spent = d && d.items ? d.items.reduce((a, i) => a + (i.cost || 0), 0) : 0;
  if (!spent && !p.budget) return "";
  return p.budget ? `<span style="color:${spent > p.budget ? "var(--fat)" : "inherit"}">${naira(spent)} of ${naira(p.budget)}</span>` : naira(spent);
}
function weighCard() {
  if (viewDate !== todayStr()) return "";
  const td = todayStr(), w = state.weights.find(x => x.d === td);
  const week = state.weights.filter(x => daysBetween(x.d, td) < 7).length;
  return `<section class="card"><div class="card-head"><h2>Morning weigh-in</h2><span class="pill ${week >= 3 ? "ok" : ""}">${Math.min(week, 7)} of 3 this week</span></div>
    <div class="row"><input type="number" id="w-in" inputmode="decimal" min="30" max="250" step="0.1" placeholder="Weight (kg)" value="${w ? w.kg : ""}" aria-label="Today's weight in kg"><button class="btn" data-act="saveweight">${w ? "Update" : "Log"}</button></div>
    <p class="small muted" style="margin:8px 0 0">After the toilet, before eating. 3+ a week lets the app measure your real metabolism.</p></section>`;
}
function todayHTML() {
  const p = state.profile, t = targets(), d = getDay(viewDate) || { items: [], water: 0, steps: 0, wd: false }, tot = dayTotals(viewDate);
  const left = t.cal - tot.kcal, st = calStatus(p.goal, tot.kcal, t), wo = workoutFor(viewDate);
  const items = d.items || [];
  const meals = SLOTS.map(([k, label]) => {
    const list = items.filter(i => i.slot === k);
    const kc = list.reduce((a, i) => a + i.kcal, 0);
    return `<div class="meal"><div class="meal-head"><h3>${label}</h3><span class="small muted num">${list.length ? fmt(kc) + " kcal" : ""}</span></div>
      ${list.length ? list.map(i => `<div class="item"><span class="nm">${esc(FOOD[i.fid] ? FOOD[i.fid].name : i.name)} <span class="muted small">· ${esc(amountText(FOOD[i.fid], i.g))}${i.oil && i.oil !== "normal" ? " · " + i.oil + " oil" : ""}</span></span><span class="num small">${fmt(i.kcal)}</span><button class="x" data-act="rmitem" data-id="${i.id}" aria-label="Remove">×</button></div>`).join("")
      : `<button class="btn line sm" data-act="logslot" data-slot="${k}" style="margin-top:6px">+ Add ${label.toLowerCase()}</button>`}
    </div>`;
  }).join("");
  const water = d.water || 0, sachets = Math.ceil(t.water / 500), full = Math.floor(water / 500);
  const steps = d.steps || 0, sg = stepGoal(viewDate);
  const woDone = wo.type === "rest" || d.wd;
  const checks = [
    ["Calories", st === "ok", st === "none" ? "Nothing logged yet" : st === "ok" ? "On target" : st === "over" ? `${fmt(tot.kcal - t.cal)} kcal over` : `${fmt(t.cal - tot.kcal)} kcal to go`],
    ["Protein", tot.p >= t.protein * 0.85, `${fmt(tot.p)} of ${t.protein} g`],
    ["Water", water >= t.water, `${fmt1(water / 1000)} of ${fmt1(t.water / 1000)} L`],
    ["Steps", steps >= sg.goal, `${fmt(steps)} of ${fmt(sg.goal)}`],
    ["Workout", woDone, wo.type === "rest" ? "Rest day" : d.wd ? "Done" : wo.title]
  ];
  const done = checks.filter(c => c[1]).length, sk = streak(t);
  const heroLine = tot.kcal < 1 ? "Log your first meal to start the day." : left >= 0 ? `${fmt(left)} kcal left` : `${fmt(-left)} kcal over target`;
  return `${topbar(p.name ? esc(p.name) : "Today", true)}
  ${updateBanner()}
  <div class="grid two"><div class="col">
    <section class="card"><div class="hero"><div class="ring">${ringSVG(tot.kcal, t.cal)}<div class="center"><span class="big num">${fmt(tot.kcal)}</span><span class="small muted">of ${fmt(t.cal)} kcal</span></div></div>
      <div class="macros"><p class="small"><b>${heroLine}</b></p>${macroBar("Protein", tot.p, t.protein, "var(--prot)")}${macroBar("Carbs", tot.c, t.carbs, "var(--carb)")}${macroBar("Fat", tot.f, t.fat, "var(--fat)")}</div></div>
      <p class="small protline">${proteinHelp(viewDate, t)}</p></section>
    <section class="card"><div class="card-head"><h2>Daily checklist</h2><span class="pill ${done === 5 ? "ok" : ""}">${done}/5 · ${sk} day streak</span></div>
      <div class="checklist">${checks.map(c => `<div class="check"><span class="tick ${c[1] ? "on" : ""}" aria-hidden="true">✓</span><span><b>${c[0]}</b></span><span class="small muted num">${c[2]}</span></div>`).join("")}</div></section>
    ${viewDate === todayStr() ? suggestCard() : ""}
    <section class="card"><div class="card-head"><h2>Meals</h2><span class="row"><span class="small muted num">${spentHTML(viewDate)}</span><button class="btn sm" data-tab="log">Add food</button></span></div>${meals}</section>
  </div><div class="col">
    ${weighCard()}
    <section class="card"><div class="card-head"><h2>Water</h2><span class="num small muted">${fmt1(water / 1000)} / ${fmt1(t.water / 1000)} L</span></div>
      <div class="water-glasses" aria-label="${full} of ${sachets} sachets">${Array.from({ length: sachets }, (_, i) => `<span class="sachet ${i < full ? "full" : ""}"></span>`).join("")}</div>
      <div class="wrapflex"><button class="btn sm" data-act="water" data-ml="500">+ Sachet 500 ml</button><button class="btn ghost sm" data-act="water" data-ml="250">+ Cup 250 ml</button><button class="btn line sm" data-act="water" data-ml="-250" ${water ? "" : "disabled"}>− 250 ml</button></div></section>
    <section class="card"><div class="card-head"><h2>Steps</h2><span class="num small muted">goal ${fmt(sg.goal)}</span></div>
      <div class="bar" style="height:10px;margin-bottom:12px"><i style="width:${Math.min(100, steps / sg.goal * 100)}%;background:var(--green)"></i></div>
      ${stepSourceHTML(steps)}
      <p class="small muted" style="margin:8px 0 0">${sg.adaptive ? `Today's goal comes from your last ${sg.n} days: beat it on more than half of them and it rises; a rough day lowers it a little.` : `Log steps for 3 days and the goal starts following what you actually walk.`}${sg.goal >= 8000 ? " Past about 8,000 a day the health benefit levels off; extra steps still burn calories." : ""} ${healthOn() ? "" : "Copy the number from Samsung Health or the iPhone Health app before bed."}</p></section>
    <section class="card"><div class="card-head"><h2>${esc(wo.title)}</h2><span class="pill ${woDone ? "ok" : ""}">${wo.type === "rest" ? "Rest" : d.wd ? "Done" : wo.type === "walk" ? "Walk" : wo.deload ? "Lighter week" : "Strength"}</span></div>
      <p class="small muted" style="margin:0 0 12px">${wo.type === "strength" ? `${wo.ex.length} moves ${PLACE_SHORT[tcfg().place]}, about ${wo.mins} min. Stop each set with ${wo.rir} reps left.` : esc(wo.sub)}</p>
      ${true ? `<div class="wrapflex"><button class="btn sm" data-tab="plan">Open workout</button>${wo.type === "walk" ? `<button class="btn ghost sm" data-act="wdone">${d.wd ? "Mark not done" : "Mark done"}</button>` : ""}</div>` : ""}</section>
  </div></div>`;
}

/* ---------- Log (plate builder) ---------- */
function portionKcal(f) { return calc(f, unitsFor(f)[f.cat === "Swallow" && !f.custom ? 1 : 0].g, "normal").kcal; }
function searchText(f) { return (f.name + " " + f.aka + " " + (UNITS[f.id] || []).map(u => u[0]).join(" ")).toLowerCase(); }
function foodListHTML() {
  const q = logQuery.trim().toLowerCase();
  const mine = customList();
  const list = mine.concat(FOODS.map(r => FOOD[r[0]])).filter(f => (logCat === "All" || (logCat === "My foods" ? f.custom : f.cat === logCat && !f.custom)) && (!q || searchText(f).includes(q)));
  const row = f => { const u = unitsFor(f)[f.cat === "Swallow" && !f.custom ? 1 : 0];
    return `<button class="food" data-act="openfood" data-id="${f.id}"><span class="nm">${esc(f.name)}${f.custom ? ' <span class="pill ok">Your food</span>' : f.conf === "C" ? ' <span class="pill est">Estimate</span>' : ""}<br><span class="aka">${esc(f.aka)}</span></span><span class="kc num"><b>${fmt(portionKcal(f))}</b> kcal<br><span class="muted">${esc(u.label.toLowerCase())}</span></span></button>`; };
  if (!list.length) return `<p class="muted">No food matches “${esc(logQuery)}”. Try another name, like “akpu” for fufu.</p>`;
  if (logCat === "All" && !q) return (mine.length ? `<h3 class="cat-h">My foods</h3>${mine.map(row).join("")}` : "") + CATS.map(c => `<h3 class="cat-h">${c}</h3>${list.filter(f => f.cat === c && !f.custom).map(row).join("")}`).join("");
  return list.map(row).join("");
}
function logHTML() {
  const listHTML = foodListHTML();
  const favs = state.favs.length ? `<section class="card"><div class="card-head"><h2>Usual plates</h2><span class="small muted">Tap to add to ${SLOTS.find(s => s[0] === logSlot)[1].toLowerCase()}</span></div>
    <div class="wrapflex">${state.favs.map(fv => `<span class="fav"><button class="chip" data-act="addfav" data-id="${fv.id}">+ ${esc(fv.name)} <span class="muted num">· ${fmt(fv.items.reduce((a, i) => a + (FOOD[i.fid] ? calc(FOOD[i.fid], i.g, i.oil).kcal : 0), 0))}</span></button><button class="x" data-act="rmfav" data-id="${fv.id}" aria-label="Delete ${esc(fv.name)}">×</button></span>`).join("")}</div></section>` : "";
  return `${topbar("Add food", true)}
  <div class="grid">
    <div class="seg" role="radiogroup" aria-label="Meal">${SLOTS.map(([k, l]) => `<label><input type="radio" name="slot" value="${k}" ${logSlot === k ? "checked" : ""}><span>${l}</span></label>`).join("")}</div>
    ${viewDate === todayStr() ? suggestCard() : ""}
    ${favs}
    <section class="card">
      <input type="search" id="food-q" placeholder="Search: eba, egusi, Milo sachet, Agege, dodo…" value="${esc(logQuery)}" aria-label="Search foods" autocomplete="off">
      <button class="btn line sm" data-act="newfood" style="margin-top:10px">+ Add your own food</button>
      <div class="chips" style="margin-top:10px">${["All"].concat(customList().length ? ["My foods"] : [], CATS).map(c => `<button class="chip" data-act="cat" data-cat="${c}" aria-pressed="${logCat === c}">${c}</button>`).join("")}</div>
      <div class="food-list" id="food-list">${listHTML}</div>
      <p class="small muted" style="margin-top:12px">Values per portion as eaten. Soups are counted without meat or fish; add those from Proteins. “Estimate” marks recipe-based values.</p>
    </section>
  </div>`;
}
function plateTotals() { return plate.reduce((a, i) => { const m = calc(FOOD[i.fid], i.g, i.oil); return { kcal: a.kcal + m.kcal, p: a.p + m.p, c: a.c + m.c, f: a.f + m.f }; }, { kcal: 0, p: 0, c: 0, f: 0 }); }
function trayHTML() {
  const t = plateTotals(), slotLabel = SLOTS.find(s => s[0] === logSlot)[1];
  return `<div class="tray"><div class="tray-in">
    <div class="row between"><button class="row" data-act="tray" style="background:none;border:0;color:inherit;padding:0;text-align:left" aria-expanded="${trayOpen}"><span><b>Plate · ${plate.length} item${plate.length > 1 ? "s" : ""}</b><br><span class="small muted num">${fmt(t.kcal)} kcal · P ${fmt(t.p)} · C ${fmt(t.c)} · F ${fmt(t.f)} g</span></span><span aria-hidden="true" style="margin-left:6px">${trayOpen ? "▾" : "▴"}</span></button>
    <button class="btn" data-act="commit">Add to ${slotLabel.toLowerCase()}</button></div>
    ${trayOpen ? `<div class="tray-list">${plate.map((i, ix) => { const f = FOOD[i.fid] || { name: "Deleted food", f: 0, kcal: 0, p: 0, c: 0, cat: "" }; return `<div class="item"><span class="nm">${esc(f.name)} <span class="muted small">· ${esc(amountText(f, i.g))}${isOily(f) && i.oil !== "normal" ? " · " + i.oil + " oil" : ""}</span></span><span class="num small">${fmt(calc(f, i.g, i.oil).kcal)}</span><button class="x" data-act="rmplate" data-ix="${ix}" aria-label="Remove">×</button></div>`; }).join("")}</div>
      ${savingFav ? `<div class="row"><input type="text" id="fav-name" maxlength="28" placeholder="Name, e.g. Eba + egusi" aria-label="Plate name"><button class="btn ghost sm" data-act="savefav">Save</button></div>`
      : `<div class="wrapflex"><button class="btn ghost sm" data-act="favmode">Save as usual plate</button><button class="btn ghost sm" data-act="clearplate">Clear plate</button></div>`}` : ""}
  </div></div>`;
}

/* ---------- Food sheet ---------- */
let sheetState = null;
function openFood(id) {
  const f = FOOD[id], units = unitsFor(f);
  sheetState = { f, unit: units[f.cat === "Swallow" && !f.custom ? 1 : 0].k, qty: 1, oil: "normal", custom: null };

function suggestion(t) {

  if (recent.length < 2) return null;

  if (span < 12) return { wait: true, text: `Weekly check: keep weighing in. Your plan is reviewed once you have two weigh-ins at least 12 days apart.` };
  const rate = (last.kg - first.kg) / span * 7;
  const r = `${rate >= 0 ? "+" : ""}${fmt1(rate)} kg/week`;
  const plan = planRateKg(p, t.w), pr = `${plan >= 0 ? "+" : "−"}${fmt1(Math.abs(plan))} kg/week`;
  if (p.goal !== "maintain" && plan === 0) return { ok: true, text: `You've reached your target weight. Your calories now hold it there; set a new target in Me to keep going.` };
  if (p.goal === "gain") {

    if (rate > plan * 1.75 + 0.1) return { delta: -150, text: `You're gaining ${r}, well above your plan of ${pr}. Most of that extra is fat. Cut 150 kcal a day.` };
    return { ok: true, text: `Gaining ${r} against a plan of ${pr}. On pace; keep going.` };
  }
  if (p.goal === "lose") {

      if (t.cal - 150 < t.floor) return { ok: true, text: `Losing ${r}. Your calories are already at the safe minimum, so add 1,000 steps a day instead of eating less.` };
      return { delta: -150, text: `Losing ${r}, under half your plan of ${pr}. Cut 150 kcal a day.` };
    }
    if (rate < -0.01 * t.w) return { delta: 150, text: `Losing ${r}, faster than 1% of your weight a week, which costs muscle. Add 150 kcal a day.` };
    return { ok: true, text: `Losing ${r} against a plan of ${pr}. On pace; keep going.` };
  }

}

    if (v > 0 && v <= 3000) {
      sheetState.custom = Math.round(v);
      $("#sheet-m").innerHTML = mgridInner(calc(sheetState.f, sheetState.custom, sheetState.oil));
      $("#sheet-cost").textContent = naira(costOf(sheetState.f, sheetState.custom));
      document.querySelectorAll("#sheet [data-act=unit]").forEach(b => b.setAttribute("aria-pressed", "false"));
      const q = document.querySelector("#sheet .stepper b"); if (q) q.textContent = "–";
    }
  } else if (ev.target.id === "sheet-price") {
    const v = Number(ev.target.value);
    if (v >= 0 && ev.target.value !== "") { state.prices[sheetState.f.id] = Math.round(v); $("#sheet-cost").textContent = naira(costOf(sheetState.f, sheetState.custom != null ? sheetState.custom : sheetGrams())); }
  } else if (ev.target.closest && ev.target.closest(".ob")) updatePreview();
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.lg) { logSet(t); return; }
  if (t.name === "pf-sex") { const w = $("#pf-bg-wrap"); if (w) { const cur = document.querySelector('input[name="pf-bg"]:checked'); w.innerHTML = bodyGoalList(t.value, cur ? cur.value : ""); } }
  if (t.name === "pf-bg") { const g = document.querySelector(`input[name="pf-goal"][value="${BG_WEIGHT[t.value]}"]`); if (g) g.checked = true; }
  if (t.id === "sheet-price") { save(); return; }
  if (t.name === "cf-basis") {
    const pack = t.value === "pack";
    $("#cf-g-label").textContent = pack ? "Pack or serving weight (g)" : "Your usual portion (g)";
    $("#cf-price-label").textContent = pack ? "Price per pack (₦)" : "Price per portion (₦)";
    $("#cf-portion-wrap").hidden = pack; return;
  }
  if (t.id === "use-measured") { state.profile.useMeasured = t.checked; save(); render(); toast(t.checked ? "Targets will use your measured burn" : "Targets use the formula"); }
  else if (t.name === "slot") { logSlot = t.value; render(); }
  else if (t.name === "oil") { sheetState.oil = t.value; drawSheet(); }
  else if (t.name === "pf-hu") {
    const { p } = readProfile(); obUnit = t.value;
    if (!state.profile) { $("#app").innerHTML = onboardingHTML(); fill(p); updatePreview(); }
    else { render(); fill(p); }
  } else if (t.closest && t.closest(".ob")) updatePreview();
});
function logSet(el) {
  const ds = el.dataset.d, key = el.dataset.lg, s = Number(el.dataset.s), d = ensureDay(ds);
  d.lg = d.lg || {}; const arr = d.lg[key] = d.lg[key] || [];
  arr[s] = arr[s] || {}; const v = Number(el.value); arr[s][el.dataset.f] = v > 0 ? v : 0;
  const wo = workoutFor(ds), i = wo.ex.findIndex(e => e.key === key), e = wo.ex[i];
  if (e && Array.from({ length: e.sets }, (_, k) => arr[k] && arr[k].r > 0).every(Boolean) && !d.ex[i]) {
    d.ex[i] = true; const tk = document.querySelector(`[data-act=extick][data-i="${i}"]`); if (tk) { tk.classList.add("on"); tk.setAttribute("aria-pressed", "true"); }
    if (wo.ex.every((_, k) => d.ex[k])) { d.wd = true; toast("Session done. Strong work."); }
  }
  save();
}
let restEnd = 0, restTimer = null;
function startRest(sec) { restEnd = Date.now() + sec * 1000; clearInterval(restTimer); tickRest(); restTimer = setInterval(tickRest, 250); }
function stopRest() { clearInterval(restTimer); restTimer = null; $("#rest").hidden = true; }
function tickRest() {
  const el = $("#rest"), left = Math.ceil((restEnd - Date.now()) / 1000);
  if (left <= 0) {
    clearInterval(restTimer); restTimer = null;
    el.innerHTML = `<b>Rest done. Next set!</b><button data-act="restoff">OK</button>`; el.hidden = false;
    try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) {}
    setTimeout(() => { if (!restTimer) el.hidden = true; }, 6000); return;
  }
  el.hidden = false; el.innerHTML = `<span>Rest</span><b class="num">${Math.floor(left / 60)}:${pad(left % 60)}</b><button data-act="restoff">Skip</button>`;
}
function fill(p) {
  const set = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
  set("pf-name", p.name); set("pf-age", p.age || ""); set("pf-w", p.weightKg || ""); set("pf-act", p.act); set("pf-budget", p.budget || "");
  if (p.heightCm) { if (obUnit === "cm") set("pf-h", p.heightCm); else { set("pf-ft", Math.floor(p.heightCm / 30.48)); set("pf-in", Math.round((p.heightCm / 2.54) % 12)); } }
  ["pf-goal", "pf-sex"].forEach(n => { const v = n === "pf-goal" ? p.goal : p.sex; const r = document.querySelector(`input[name="${n}"][value="${v}"]`); if (r) r.checked = true; });
  set("pf-target", p.targetKg || ""); set("pf-level", p.level);
  if (p.sex) { const w = $("#pf-bg-wrap"); if (w) w.innerHTML = bodyGoalList(p.sex, p.bodyGoal); }
  [["pf-bg", p.bodyGoal], ["pf-pace", p.pace], ["pf-place", p.place], ["pf-days", p.days]].forEach(([n, v]) => { const r = v != null && document.querySelector(`input[name="${n}"][value="${v}"]`); if (r) r.checked = true; });
}
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("#sheet").hidden) closeSheet();
  if (ev.key === "Enter" && ev.target.id === "fav-name") { ev.preventDefault(); $("[data-act=savefav]").click(); }
});
/* Keep "today" fresh if the app stays open past midnight */
let lastSeenDay = todayStr();
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayStr() !== lastSeenDay) { if (viewDate === lastSeenDay) viewDate = todayStr(); lastSeenDay = todayStr(); render(); } });

/* ---------- Installed app: updates and offline ---------- */
const APP_BUILD = Number("__BUILD__") || 0;
const UPDATE_URL = "https://corur131.github.io/chop-count/version.json";
let updateInfo = null;
const IS_NATIVE = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform());
let lastUpdateCheck = 0, updateMsg = "";
/* Checks at start, whenever the app comes back to the screen (at most every 10 min), and from Me → Check for updates. */
async function checkUpdate(manual) {
  if (!IS_NATIVE || !APP_BUILD) return;
  lastUpdateCheck = Date.now();
  if (manual) { updateMsg = "Checking…"; render(); }
  try {
    const r = await fetch(UPDATE_URL + "?t=" + Date.now(), { cache: "no-store" });
    const v = await r.json();
    if (v && v.build > APP_BUILD && v.apk) { updateInfo = v; updateMsg = ""; }
    else if (manual) updateMsg = "You have the latest version.";
  } catch (e) { if (manual) updateMsg = "Couldn't check. Connect to the internet and try again."; }
  render();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastUpdateCheck > 10 * 60 * 1000) checkUpdate(); });
function updateBanner() {
  if (!updateInfo) return "";
  return `<section class="card suggest"><div class="row between"><div><b>New version available</b><p class="small muted" style="margin:2px 0 0">Download it, then install over this app. Your data stays.</p></div>
    <a class="btn sm" href="${esc(updateInfo.apk)}" target="_blank" rel="noopener" style="text-decoration:none">Download</a></div></section>`;
}
if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname)) { navigator.serviceWorker.register("sw.js").catch(() => {}); }

/* ---------- Automatic steps (Android app): Samsung Health → Health Connect → Chop Count ---------- */
const HEALTH = IS_NATIVE && window.Capacitor.Plugins ? window.Capacitor.Plugins.Health : null;
const HC_STORE = "https://play.google.com/store/apps/details?id=com.google.android.apps.healthdata";
let stepSyncAt = 0, stepMsg = "", stepNeedsInstall = false;
function hcFlag() { try { return localStorage.getItem("chopcount.hc") === "1"; } catch (e) { return false; } }
function setHcFlag(v) { try { if (v) localStorage.setItem("chopcount.hc", "1"); else localStorage.removeItem("chopcount.hc"); } catch (e) {} }
function healthOn() { return !!HEALTH && hcFlag(); }
function stepSourceHTML(steps) {
  const manual = `<div class="row"><input type="number" id="steps-in" inputmode="numeric" min="0" max="100000" step="100" value="${steps || ""}" placeholder="Steps so far" aria-label="Steps today"><button class="btn" data-act="savesteps">Save</button></div>`;
  if (!HEALTH) return manual;
  if (!hcFlag()) return `<button class="btn block" data-act="hconnect">Count my steps automatically</button>
    ${stepMsg ? `<p class="small err" style="margin:8px 0 0">${esc(stepMsg)}</p>` : ""}
    ${stepNeedsInstall ? `<a class="btn line sm" href="${HC_STORE}" target="_blank" rel="noopener" style="text-decoration:none;margin-top:8px;display:inline-block">Get Health Connect</a>` : ""}
    <details style="margin-top:10px"><summary class="small muted">Or type them in</summary><div style="margin-top:8px">${manual}</div></details>`;
  const at = stepSyncAt ? new Date(stepSyncAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
  return `<div class="row between"><span class="small"><span class="pill ok">Automatic</span> ${stepMsg ? `<span class="err">${esc(stepMsg)}</span>` : at ? `<span class="muted">from your phone, updated ${at}</span>` : `<span class="muted">reading…</span>`}</span><button class="btn line sm" data-act="hsync">Refresh</button></div>`;
}
async function healthConnect() {
  stepMsg = ""; stepNeedsInstall = false;
  try {
    const av = await HEALTH.isAvailable();
    if (!av || !av.available) {
      stepNeedsInstall = true;
      stepMsg = /update/i.test((av && av.reason) || "") ? "Health Connect needs an update. Update it from the Play Store, then tap again." : "This phone needs the free Health Connect app from Google first. Install it, then tap again.";
      render(); return;
    }
    const r = await HEALTH.requestAuthorization({ read: ["steps"], write: [] });
    if (r && (r.readAuthorized || []).includes("steps")) { setHcFlag(true); await syncSteps(true); toast("Steps now update by themselves"); }
    else { stepMsg = "Step access wasn't allowed. Tap again and switch Steps on."; render(); }
  } catch (e) { stepMsg = "Couldn't open Health Connect. Try again."; render(); }
}
/* Reads daily step totals for the last 10 days; Health Connect merges phone and watch counts so steps aren't doubled. */
async function syncSteps(force) {
  if (!healthOn() || (!force && Date.now() - stepSyncAt < 60 * 1000)) return;
  try {
    const start = parseDay(addDays(todayStr(), -9)); start.setHours(0, 0, 0, 0);
    const res = await HEALTH.queryAggregated({ dataType: "steps", startDate: start.toISOString(), endDate: new Date().toISOString(), bucket: "day", aggregation: "sum" });
    let changed = false;
    (res && res.samples || []).forEach(s => {
      const ds = todayStr(new Date(new Date(s.startDate).getTime() + 60 * 1000)), v = Math.round(s.value || 0);
      if (v > 0 && (!state.days[ds] || state.days[ds].steps !== v)) { ensureDay(ds).steps = v; changed = true; }
    });
    const hadMsg = !!stepMsg, first = !stepSyncAt; stepSyncAt = Date.now(); stepMsg = "";
    if (changed) save();
    if (changed || hadMsg || first || force) render();
    return;
  } catch (e) {
    const m = String(e && e.message || e);
    if (/permission|authori|security/i.test(m)) { setHcFlag(false); stepMsg = "Step access was turned off. Tap to allow it again."; }
    else stepMsg = "Couldn't read steps just now.";
  }
  render();
}
if (HEALTH) document.addEventListener("visibilitychange", () => { if (!document.hidden) syncSteps(); });

/* ---------- Boot ---------- */
(function boot() {
  const local = readLocal();
  if (local && local.v) state = Object.assign(blank(), local);
  syncCustom();
  render();
  connectCloud();
  checkUpdate();
  syncSteps(true);
})();
</script>
